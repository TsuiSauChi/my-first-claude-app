<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebP Upload</title>
<style>
  :root { color-scheme: light dark; --ink: #1b2127; --muted: #5d6873; --line: #d4dbe1; --bg: #f5f7f9; --panel: #fff; --accent: #2a62a8; --bad: #a33a17; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e5eaef; --muted: #98a4af; --line: #2d3843; --bg: #11171d; --panel: #19222b; --accent: #7cb3f0; --bad: #f2a07c; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px; display: grid; gap: 20px; }
  h1 { margin: 0; font-size: 1.8rem; }
  p { margin: 0; color: var(--muted); }
  form { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: var(--panel); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #result { display: grid; gap: 12px; }
  #result img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); }
  .error { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>WebP Upload</h1>
  <p>Upload a JPEG, PNG, GIF, BMP or TIFF. The server converts it to WebP, scales it to at most 2048&nbsp;px on the long edge, and removes location and camera data.</p>
  <form id="form">
    <input id="file" name="file" type="file" accept="image/*" required>
    <button id="go" type="submit">Upload and convert</button>
  </form>
  <section id="result" aria-live="polite"></section>
</main>
<script>
const kb = n => (n / 1024).toFixed(1) + " KB";
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const out = document.getElementById("result"), btn = document.getElementById("go");
  const body = new FormData();
  body.append("file", document.getElementById("file").files[0]);
  btn.disabled = true;
  out.textContent = "Converting…";
  try {
    const res = await fetch("/upload", { method: "POST", body });
    let json = null;
    try { json = await res.json(); } catch (_) {}
    if (!res.ok) {
      const detail = json && json.detail;
      const msg = typeof detail === "string" ? detail
        : Array.isArray(detail) ? detail.map(d => d.msg).join("; ")
        : `The server returned ${res.status} ${res.statusText}.`;
      throw new Error(msg);
    }
    if (!json) throw new Error("The server sent a response this page could not read.");
    const saved = 100 - Math.round(json.bytes / json.original_bytes * 100);
    out.innerHTML = `<img alt="Converted image" src="${json.url}">
      <dl><dt>Original</dt><dd>${kb(json.original_bytes)}</dd>
      <dt>WebP</dt><dd>${kb(json.bytes)} (${saved >= 0 ? saved + "% smaller" : -saved + "% larger"})</dd>
      <dt>Size</dt><dd>${json.width} × ${json.height}</dd>
      <dt>URL</dt><dd><a href="${json.url}">${json.url}</a></dd></dl>`;
  } catch (err) {
    out.innerHTML = "";
    const p = document.createElement("p");
    p.className = "error";
    p.textContent = "Upload failed. " + err.message;
    out.append(p);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
